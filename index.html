<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Press+Start+2P&display=swap" rel="stylesheet">
        <title>Etch a Sketch</title>
    </head>
    <body>
        <header>Etch a Sketch</header>
        <main>
            <section class="menu">
                grid-size:<span id="size">1</span><input id="sizeSlider" type="range" value="1" min="1" max="64">
                <input id="colorPicker" type="color" value="red">
                <button id="random">random-color</button>
                <button id="eraser">eraser</button>
                <button id="clear">clear-screen</button>
            </section>
            <section id="screen"></section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
